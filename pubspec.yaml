name: shopify
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management
  flutter_riverpod: ^3.0.3
  # Annotations only
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  # Networking
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.0.0            
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Splash screen
  flutter_native_splash: ^2.4.7
  # For adaptive screen and font size
  flutter_screenutil: ^5.9.3
  # An easy way to add shimmer effect
  shimmer: ^3.0.0
  # Utilities
  intl: ^0.20.2
  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  form_field_validator: ^1.1.0
  flutter_rating_bar: ^4.0.1
  flutter_widget_from_html_core: ^0.17.0
  animations: ^2.0.11
  url_launcher: ^6.3.0
  # Image
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4  
  # Code generators
  build_runner: ^2.4.13
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  retrofit_generator: ^10.2.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/Illustration/
    - assets/logo/

  fonts:
    - family: Plus Jakarta
      fonts:
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Regular.otf
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Bold.otf
          weight: 700
    - family: Grandis Extended
      fonts:
        - asset: assets/fonts/grandis_extended/GrandisExtended-Regular.ttf
        - asset: assets/fonts/grandis_extended/GrandisExtended-Thin.ttf
          weight: 300
        - asset: assets/fonts/grandis_extended/GrandisExtended-Medium.ttf
          weight: 500
        - asset: assets/fonts/grandis_extended/GrandisExtended-Bold.ttf
          weight: 700
        - asset: assets/fonts/grandis_extended/GrandisExtended-Black.ttf
          weight: 900
